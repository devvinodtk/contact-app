name: Restrict PRs to main
on: 
  pull_request:
    breanches:
      - main

jobs:
  check-pr-branch:
    runs-on: ubuntu-latest
    steps: 
      - name: Ensure PR comes from dev
        run: |
          if [[ "${{ github.event.pull_request.head.ref }}" != "dev" ]]; then
            echo "❌ Only PRs from dev are allowed into main."
            exit 1
          fi
          
